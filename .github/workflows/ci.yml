# Fast checks that run on GitHub's own machines for every push and pull
# request. Nothing here needs a GPU, the Apptainer image or the models; those
# tests run on a compute node with scripts/test_on_node.sbatch.
#
# A pytest job for the tests without markers is planned (see
# docs/dev/testing.md).

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint, syntax and architecture rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Syntax check of all Python files
        run: python -m compileall -q src tests

      - name: Import rules (backend never imports a user interface)
        run: lint-imports

  docs:
    name: Documentation builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs Material
        run: pip install "mkdocs==1.6.1" "mkdocs-material==9.7.7"

      - name: Build the site
        run: mkdocs build --strict
