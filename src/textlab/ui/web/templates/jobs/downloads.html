{#- The files a finished job offers, as a file listing; included in its
  record. -#}
<div class="files">
  <p class="label">Downloads</p>
  <ul class="files__list">
    {% for item in job.downloads %}
    <li>
      <a class="file{% if loop.first %} file--main{% endif %}" href="{{ root }}/jobs/{{ job.id }}/files/{{ item.name | urlencode }}" download>
        <span class="file__name">{{ item.name }}</span>
        <span class="file__kind">{{ item.label }}</span>
        <span class="file__size">{% if item.size is not none %}{{ item.size | file_size }}{% endif %}</span>
        {{ icon("download", size="sm") }}
      </a>
    </li>
    {% endfor %}
  </ul>
</div>
