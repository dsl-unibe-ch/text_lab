# Project metadata and tool configuration for Text Lab.
#
# Runtime dependencies are not listed here: they are pinned in
# deploy/container/text_lab.def and ship inside the Apptainer image, which is
# the only environment the app runs in. This file configures the development
# tools (ruff, pytest, import-linter) and names the package.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "textlab"
version = "2.0.0.dev0"
description = "AI and NLP tools for research data, served through Open OnDemand"
readme = "readme.MD"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Tools used by CI and for local checks; not needed to run the app.
dev = [
    "ruff==0.11.10",
    "import-linter==2.3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["textlab*"]

# --------------------------------------------------------------------------
# ruff: linting and formatting
# --------------------------------------------------------------------------

[tool.ruff]
line-length = 79
target-version = "py311"
src = ["src"]
# Code that has not been migrated into src/textlab yet. It is linted once it
# moves; each refactor phase removes its entries from this list.
extend-exclude = [
    "src/Home.py",
    "src/auth.py",
    "src/language_mappings.py",
    "src/core",
    "src/pages",
    "src/tools",
    "tests",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "N",   # PEP 8 naming
    "D",   # docstrings
    "UP",  # modern Python syntax
    "B",   # likely bugs
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test functions are documented by their names.
"**/tests/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["textlab"]

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------

[tool.pytest.ini_options]
# Feature tests live next to their code in src/textlab/features/*/tests/;
# tests/ holds cross-cutting tests only.
testpaths = ["src/textlab", "tests"]
# "tests" is on the path only because the unmigrated tests import
# conftest_path.py and each other. Remove it once they have moved.
pythonpath = ["src", "tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
markers = [
    "gpu: needs a CUDA GPU",
    "container: needs the Text Lab Apptainer image (models, binaries)",
    "ollama: needs a running Ollama server",
    "slow: takes more than about a minute",
]

# --------------------------------------------------------------------------
# import-linter: architecture rules
# --------------------------------------------------------------------------

[tool.importlinter]
root_packages = ["textlab"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Backend never imports a user interface"
type = "forbidden"
source_modules = ["textlab.features", "textlab.common"]
forbidden_modules = ["streamlit", "textlab.ui"]
